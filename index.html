}

<script>

/* ---------- API ---------- */
const cache=new Map(),V={},CH={};

}
const norm=v=>V[v.id]={id:v.id,title:v.snippet.title,ch:v.snippet.channelTitle,chId:v.snippet.channelId,thumb:(v.snippet.thumbnails.maxres||v.snippet.thumbnails.high||v.snippet.thumbnails.medium||{}).url,d:dur(v.contentDetails?.duration),views:v.statistics?.viewCount,pub:v.snippet.publishedAt,desc:v.snippet.description||''};

    const s=SH.list.length;SH.list.push(...add);root.insertAdjacentHTML('beforeend',add.map((v,i)=>sec(v,s+i)).join(''));$$('.sec',root).slice(s).forEach(e=>io.observe(e))}catch(e){if(!SH.list.length)root.innerHTML=errHtml(e);else toast(e.message)}SH.busy=0}

   if(b=g('data-ssub')){togSub(SH.list[b.dataset.ssub]);const s=subbed(SH.list[b.dataset.ssub].chId);b.classList.toggle('on',s);b.textContent=s?'Subscribed':'Subscribe'}};
  cleanup=()=>{clearInterval(SH.t);document.removeEventListener('keydown',key);io.disconnect();Object.values(SH.ps).forEach(p=>{try{p.destroy()}catch{}});document.body.classList.remove('sh-on')};
  root.innerHTML='';await more()};

/* ---------- shell ---------- */
const NAV=[['home','Home','home'],['shorts','Shorts','zap'],['explore','Explore','compass'],['trending','Trending','flame'],0,['subs','Subscriptions','users'],['history','History','history'],['liked','Liked videos','thumb'],['later','Watch later','clock'],['playlists','Playlists','list']];
$('#side').innerHTML=NAV.map(n=>n?`<a class="ni" data-nav="${n[0]}" href="#/${n[0]}" title="${n[1]}">${ic(n[2])}<span>${n[1]}</span></a>`:'<hr>').join('');
$('#bnav').innerHTML=[['home','Home','home'],['shorts','Shorts','zap'],['explore','Explore','compass'],['subs','Subs','users'],['history','Library','history']].map(n=>`<a data-nav="${n[0]}" href="#/${n[0]}">${ic(n[2])}${n[1]}</a>`).join('');
$('#menu').innerHTML=ic('menu');$('.sbtn').innerHTML=ic('search');$('#qc').innerHTML=ic('x');$('#gear').innerHTML=ic('gear');$('#me').innerHTML=ic('user');
if(innerWidth<1100)document.body.classList.add('mini');
$('#menu').onclick=()=>innerWidth<=768?document.body.classList.toggle('open'):document.body.classList.toggle('mini');
async function route(){cleanup();cleanup=()=>{};closeMenu();document.body.classList.remove('open');
  const[p='home',...r]=location.hash.replace(/^#\/?/,'').split('/');const arg=decodeURIComponent(r.join('/'));
  $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===p));view.onclick=null;view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');
  if(p!=='watch')document.title='WilTube';scrollTo(0,0);
  try{await(P[p]||P.home)(arg)}catch(e){view.innerHTML=errHtml(e)}}
addEventListener('hashchange',route);
/* search box */
const q=$('#q'),sug=$('#sug');let si=-1;
const go=t=>{t=t.trim();if(t){sug.hidden=true;q.blur();location.hash='#/search/'+encodeURIComponent(t)}};
const POP=['music','gaming','technology','news today','podcast','live','sports highlights','tutorial'];
function showSug(){const v=q.value.trim().toLowerCase();$('#qc').hidden=!v;const l=[...new Set([...lst('sh'),...POP])].filter(s=>s.toLowerCase().includes(v)&&s.toLowerCase()!==v).slice(0,7);si=-1;sug.innerHTML=l.map(s=>`<li>${esc(s)}</li>`).join('');sug.hidden=!l.length||document.activeElement!==q}
q.oninput=showSug;q.onfocus=showSug;
q.onkeydown=e=>{const li=$$('li',sug);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();si=(si+(e.key==='ArrowDown'?1:-1)+li.length)%li.length;li.forEach((x,i)=>x.classList.toggle('on',i===si));if(li[si])q.value=li[si].textContent}if(e.key==='Escape'){sug.hidden=true;q.blur()}};
$('#sf').onsubmit=e=>{e.preventDefault();go(q.value)};sug.onmousedown=e=>{if(e.target.tagName==='LI')go(e.target.textContent)};
$('#qc').onclick=()=>{q.value='';q.focus();showSug()};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();q.focus()}});
/* global delegation */
document.addEventListener('click',async e=>{const t=e.target,g=s=>t.closest(s);let b;
  if(!g('.pop')&&!g('[data-more]'))closeMenu();
  if(b=g('[data-more]')){e.preventDefault();openMenu(b,b.dataset.more);return}
  if(b=g('[data-cat]')){cat=b.dataset.cat;P.home()}
  if(g('[data-retry]'))route();
  if(b=g('[data-unsub]')){S.set('subs',lst('subs').filter(c=>c.id!==b.dataset.unsub));P.subs()}
  if(b=g('[data-subch]')){const c=JSON.parse(b.dataset.subch);S.set('subs',subbed(c.id)?lst('subs').filter(x=>x.id!==c.id):[c,...lst('subs')]);b.classList.toggle('on');b.textContent=b.classList.contains('on')?'Subscribed':'Subscribe'}
  if(b=g('[data-rm]')){const[k,id]=b.dataset.rm.split(':');S.set(k,lst(k).filter(v=>v.id!==id));route()}
  if(b=g('[data-clr]')){const k=b.dataset.clr;if(k==='all')Object.keys(localStorage).filter(x=>x.startsWith('wt:')).forEach(x=>localStorage.removeItem(x));else S.del(k);applyCfg();toast('Cleared');route()}
  if(g('[data-newpl]')){const n=await ask('New playlist','Playlist name');if(n){S.set('pls',[...lst('pls'),{name:n,v:[]}]);P.playlists()}}
  if(b=g('[data-delpl]')){const l=lst('pls');l.splice(+b.dataset.delpl,1);S.set('pls',l);P.playlists()}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c){S.set('cfg',{...cfg(),[c]:e.target.checked});applyCfg()}});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&!e.target.dataset.f){e.target.dataset.f=1;e.target.src=FB}},true);
/* intro + boot */
applyCfg();const intro=$('#intro'),endIntro=()=>{intro.classList.add('out');setTimeout(()=>intro.remove(),700);sessionStorage.setItem('wtIntro',1)};
if(sessionStorage.getItem('wtIntro')||matchMedia('(prefers-reduced-motion:reduce)').matches)intro.remove();else{intro.onclick=endIntro;setTimeout(endIntro,2200)}
route();
</script>
</body></html>
